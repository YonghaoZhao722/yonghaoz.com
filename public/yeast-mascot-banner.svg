<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="monospace">
  <!-- background (16:9) -->
  <rect width="960" height="540" fill="#f1faf9" rx="24"/>
  <rect x="4" y="4" width="952" height="532" fill="none" stroke="#cfeae8" stroke-width="2" rx="20"/>

  <!-- decorative sparkles (pixel diamonds) -->
  <rect x="123" y="103" width="14" height="14" fill="#F4A39E" transform="rotate(45 130 110)"/>
  <rect x="813" y="103" width="15" height="15" fill="#7AD0CB" transform="rotate(45 820.5 110.5)"/>
  <rect x="89"  y="354" width="12" height="12" fill="#F4A39E" transform="rotate(45 95 360)"/>
  <rect x="858" y="413" width="14" height="14" fill="#7AD0CB" transform="rotate(45 865 420)"/>
  <rect x="145" y="455" width="10" height="10" fill="#F4A39E" transform="rotate(45 150 460)"/>

  <!-- budding trail: shrinking baby cells drifting up-right off the bud -->
  <g>
    <rect x="612" y="148" width="26" height="26" rx="8" fill="#5FC2BC"/>
    <rect x="615" y="151" width="9"  height="9"  rx="3" fill="#7AD0CB"/>
    <rect x="646" y="132" width="18" height="18" rx="6" fill="#74C8C2"/>
    <rect x="648" y="134" width="6"  height="6"  rx="2" fill="#8BD7D2"/>
    <rect x="672" y="120" width="12" height="12" rx="4" fill="#8BD7D2"/>
  </g>

  <!-- ===== HERO MASCOT: budding yeast (mother cell + bud), 18px pixels ===== -->
  <g transform="translate(382,95)">
    <!-- body fill (per-row) -->
    <rect x="54" y="0"   width="72"  height="18" fill="#35A39C"/>
    <rect x="36" y="18"  width="108" height="18" fill="#35A39C"/>
    <rect x="18" y="36"  width="144" height="18" fill="#35A39C"/>
    <rect x="0"  y="54"  width="180" height="18" fill="#35A39C"/>
    <rect x="0"  y="72"  width="180" height="18" fill="#35A39C"/>
    <rect x="0"  y="90"  width="180" height="18" fill="#35A39C"/>
    <rect x="18" y="108" width="144" height="18" fill="#35A39C"/>
    <!-- lower-right shading + bottom shadow rows -->
    <rect x="108" y="108" width="54"  height="18" fill="#2E938D"/>
    <rect x="36"  y="126" width="108" height="18" fill="#267F7A"/>
    <rect x="54"  y="144" width="72"  height="18" fill="#267F7A"/>
    <!-- top-left glossy highlight -->
    <rect x="36" y="18" width="36" height="18" fill="#5FC2BC"/>
    <rect x="18" y="36" width="36" height="18" fill="#5FC2BC"/>

    <!-- bud emerging on the right -->
    <rect x="180" y="72" width="36" height="36" fill="#5FC2BC"/>
    <rect x="180" y="72" width="18" height="18" fill="#7AD0CB"/>
    <rect x="180" y="99" width="36" height="9"  fill="#46A8A2"/>

    <!-- cheeks -->
    <rect x="36"  y="54" width="18" height="18" fill="#F4A39E"/>
    <rect x="126" y="54" width="18" height="18" fill="#F4A39E"/>
    <!-- eyes + shine -->
    <rect x="54"  y="36" width="18" height="18" fill="#16403F"/>
    <rect x="108" y="36" width="18" height="18" fill="#16403F"/>
    <rect x="57"  y="39" width="6"  height="6"  fill="#EAFBFA"/>
    <rect x="111" y="39" width="6"  height="6"  fill="#EAFBFA"/>
    <!-- smiling mouth -->
    <rect x="54"  y="72" width="18" height="18" fill="#16403F"/>
    <rect x="108" y="72" width="18" height="18" fill="#16403F"/>
    <rect x="72"  y="90" width="36" height="18" fill="#16403F"/>
  </g>

  <!-- small floating yeast cells filling the lower band -->
  <g>
    <rect x="250" y="452" width="34" height="34" rx="11" fill="#35A39C"/>
    <rect x="255" y="457" width="9"  height="9"  rx="3"  fill="#5FC2BC"/>
    <rect x="282" y="462" width="14" height="14" rx="5"  fill="#5FC2BC"/>

    <rect x="470" y="470" width="26" height="26" rx="8"  fill="#3FA8A2"/>
    <rect x="474" y="474" width="7"  height="7"  rx="2"  fill="#6CC9C3"/>
    <rect x="494" y="478" width="11" height="11" rx="4"  fill="#6CC9C3"/>

    <rect x="676" y="452" width="30" height="30" rx="10" fill="#35A39C"/>
    <rect x="680" y="456" width="8"  height="8"  rx="3"  fill="#5FC2BC"/>
    <rect x="704" y="460" width="13" height="13" rx="5"  fill="#5FC2BC"/>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="480" y="350" text-anchor="middle"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="86" font-weight="bold" letter-spacing="1.5" fill="#2E8E8B">YeastSAM</text>
  <text x="478" y="398" text-anchor="middle"
        font-size="28" fill="#5B7C7A">budding-yeast segmentation</text>
  <!-- tiny mascot full-stop -->
  <g transform="translate(706,376)">
    <rect x="0"  y="0" width="22" height="22" rx="7" fill="#35A39C"/>
    <rect x="4"  y="4" width="7"  height="7"  rx="2" fill="#5FC2BC"/>
    <rect x="21" y="6" width="11" height="11" rx="4" fill="#5FC2BC"/>
  </g>
</svg>
